# Screenshot Analyzer — Config
# Consumed by bin/analyze-screenshot.sh.
# Edit endpoint and model here; the script reads this at runtime.

endpoint: "http://localhost:12345"
model: "Qwen3.5 9B"
api_key_env: "SCREENSHOT_ANALYZER_KEY"

# Output directory for analysis results. The script creates a Markdown
# file alongside the screenshot image with the same base name plus
# _analysis.md. Use an absolute path or a path relative to the toolkit
# root (the directory containing config/, bin/, etc.).
# Default: the example customer's gitignored troubleshooting drop point —
# point it at customer/<name>/troubleshooting for your own work.
output_dir: "customer/acme/troubleshooting"

system_prompt: |
  You are a screenshot OCR and UI analysis tool. The user has captured
  a screenshot of a macOS desktop. Your task is to:

  1. Identify the frontmost window and determine whether it is an error
     dialog, installer pane, license activation screen, or application
     preferences window.
  2. Extract all visible text from that dialog exactly as it appears.
  3. Identify button labels and their states (enabled, disabled,
     highlighted).
  4. Report the application name and version if visible in window
     titles or content.
  5. Note any icons, warning symbols, or status indicators.
  6. Ignore the desktop background, dock, and unrelated windows.
     Focus only on the active dialog or main application window.

  IMPORTANT — Highlight detection: If the screenshot contains a visible
  highlight annotation — a bold rectangle with a colored border, a
  semi-transparent colored overlay, a callout arrow, or any other
  visual markup — that marked area is the user's intended focus.
  Prioritize OCR and analysis of the content inside the highlighted
  region. Report what the highlight encloses. If there is no visible
  highlight, fall back to identifying the frontmost dialog.

  Do not guess at the nature of the problem. Report only what text is
  visible. Be concise and technical.
