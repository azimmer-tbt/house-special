Comment: Pattern 2a — GitHub release, signed vendor pkg copied as-is. GitHubReleasesInfoProvider + URLDownloader; the pkg's signature is verified by certificate chain.
Description: Downloads the latest Desktoppr installer package (sets the desktop picture) from GitHub releases.
Identifier: com.acmefruit.autopkg.download.Desktoppr
MinimumVersion: "2.3"

Input:
  NAME: Desktoppr
  GITHUB_REPO: scriptingosx/desktoppr
  ASSET_REGEX: "^desktoppr-[\\d.]+-\\d+\\.pkg$"

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: "%GITHUB_REPO%"
      asset_regex: "%ASSET_REGEX%"
      include_prereleases: false

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.pkg"

  - Processor: EndOfCheckPhase

  # A flat .pkg is verified with pkgutil's certificate chain, copied verbatim from
  # `pkgutil --check-signature` (methodology lessons 5 and 6).
  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%"
      expected_authority_names:
        - "Developer ID Installer: Armin Briegel (JME5BW3F3R)"
        - Developer ID Certification Authority
        - Apple Root CA
