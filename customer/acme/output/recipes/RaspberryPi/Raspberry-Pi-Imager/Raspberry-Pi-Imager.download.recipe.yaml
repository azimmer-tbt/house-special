Comment: Pattern 2b — GitHub release DMG. GitHubReleasesInfoProvider + URLDownloader; app verified inside the mounted DMG.
Description: Downloads the latest Raspberry Pi Imager DMG from GitHub releases.
Identifier: com.acmefruit.autopkg.download.Raspberry-Pi-Imager
MinimumVersion: "2.3"

Input:
  NAME: Raspberry-Pi-Imager
  GITHUB_REPO: raspberrypi/rpi-imager
  ASSET_REGEX: "rpi-imager-v[\\d.]+\\.dmg$"

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: "%GITHUB_REPO%"
      asset_regex: "%ASSET_REGEX%"
      include_prereleases: false

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.dmg"

  - Processor: EndOfCheckPhase

  # Verify the app inside the DMG (the DMG itself is not what gets deployed).
  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%/Raspberry Pi Imager.app"
      requirement: >-
        identifier "com.raspberrypi.rpi-imager"
        and anchor apple generic
        and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */
        and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */
        and certificate leaf[subject.OU] = "8RDZTRXE62"

  # No Versioner here, deliberately: this app's CFBundleShortVersionString carries a
  # leading "v" (v2.0.11.1). GitHubReleasesInfoProvider strips it from the tag and
  # sets %version%, which is what the package should carry.
