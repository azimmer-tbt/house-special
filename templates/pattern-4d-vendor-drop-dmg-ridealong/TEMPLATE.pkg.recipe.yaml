# ─────────────────────────────────────────────────────────────────────────────
# Pattern 4d — pkg recipe (DMG source with ridealong scripts/payload)
#
# Builds a flat package from the .app extracted by the parent download recipe.
# The download recipe also staged scripts/ and payload/ under RECIPE_CACHE_DIR.
# This recipe uses PkgCreator with a scripts directory and explicit chown
# entries for both the Applications path and any payload paths.
#
# DO NOT reference %pathname% in this recipe. URLDownloader sets %pathname%;
# Copier does NOT. A Pattern 4d parent uses URLDownloader → Copier × 3,
# so while URLDownloader *does* set %pathname%, the .app path is constructed
# from %RECIPE_CACHE_DIR%/%NAME%/Applications/... which IS shared across the
# parent→child boundary.
# See reference/methodology.md items #3 and #4.
# ─────────────────────────────────────────────────────────────────────────────
Description: Pattern 4 (DMG source). PkgCreator with scripts + license injection.
Identifier: com.acmefruit.autopkg.pkg.REPLACE_APPNAME
ParentRecipe: com.acmefruit.autopkg.download.REPLACE_APPNAME
MinimumVersion: "2.3"

Input:
  NAME: REPLACE_APPNAME
  # Vendor's own bundle identifier. Read it from the .app inside the DMG:
  #   hdiutil attach -nobrowse <DMG>
  #   plutil -p "/Volumes/<Volume>/<App>.app/Contents/Info.plist" | grep CFBundleIdentifier
  #   hdiutil detach /Volumes/<Volume>
  # If you cannot confirm it, invent one AND say so in this app's README.md.
  PKG_ID: REPLACE_PKG_ID

Process:
  # Read version from the .app bundle's Info.plist (sets %version%)
  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/%NAME%/Applications/REPLACE_APPNAME.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  # Build the org-prefixed package with scripts and explicit ownership
  - Processor: PkgCreator
    Arguments:
      pkg_request:
        id: "%PKG_ID%"
        version: "%version%"
        pkgname: "Acme_%NAME%"
        pkgdir: "%RECIPE_CACHE_DIR%"
        scripts: "%RECIPE_CACHE_DIR%/scripts"
        chown:
          - path: Applications
            user: root
            group: admin
          # Add additional chown entries for payload paths here.
          # Example:
          # - path: "Users/Shared/REPLACE_VENDORDIR/REPLACE_APPNAME"
          #   user: root
          #   group: wheel
        pkgroot: "%RECIPE_CACHE_DIR%/%NAME%"
