Comment: Pattern 4a — vendor-drop pkg, copied as-is (pkg recipe).
Description: Repackages Xerox-Drivers with Acme naming convention (vendor pkg, copied as-is).
Identifier: com.acmefruit.autopkg.pkg.Xerox-Drivers
ParentRecipe: com.acmefruit.autopkg.download.Xerox-Drivers
MinimumVersion: "2.3"

Input:
  NAME: Xerox-Drivers
  PKG_ID: com.xerox.pkg.printdrivers

Process:
  - Processor: PkgCopier
    Arguments:
      source_pkg: "%RECIPE_CACHE_DIR%/Xerox-Drivers.pkg"
      pkg_path: "%RECIPE_CACHE_DIR%/Acme_%NAME%.pkg"
