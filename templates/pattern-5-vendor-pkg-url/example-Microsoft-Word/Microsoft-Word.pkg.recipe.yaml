Comment: Pattern 5 — vendor pkg via stable URL (pkg recipe).
Description: Downloads the latest version of Microsoft Word and creates a package.
Identifier: com.acmefruit.autopkg.pkg.Microsoft-Word
ParentRecipe: com.acmefruit.autopkg.download.Microsoft-Word
MinimumVersion: "2.3"

Input:
  NAME: Microsoft-Word
  APP_FILENAME: Microsoft Word

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/unpacked"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpacked/Microsoft_Word.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      purge_destination: true

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/payload/%APP_FILENAME%.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/Acme_%NAME%.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/payload"
        - "%RECIPE_CACHE_DIR%/unpacked"
